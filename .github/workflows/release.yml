name: Release Liberty

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build Release x64
        run: cmake --build build --config Release --parallel
      - name: Regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Prepare portable package
        shell: pwsh
        run: |
          Copy-Item build/Release/Liberty.exe Liberty.exe -Force
          $hash = (Get-FileHash Liberty.exe -Algorithm SHA256).Hash
          "$hash  Liberty.exe" | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liberty-Windows-x64-${{ github.ref_name }}
          path: |
            Liberty.exe
            SHA256SUMS.txt
            assets/liberty-trinity.svg
            assets/liberty-trinity-mono.svg
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArgs = @('release', 'create', $env:GITHUB_REF_NAME, 'Liberty.exe', 'SHA256SUMS.txt', 'assets/liberty-trinity.svg', 'assets/liberty-trinity-mono.svg', '--title', "Liberty by Bada $env:GITHUB_REF_NAME")
          if ($env:GITHUB_REF_NAME -match '-') { $releaseArgs += '--prerelease' }
          if ($env:GITHUB_REF_NAME -like 'v0.1.2*') { $releaseArgs += @('--notes-file', 'docs/release-0.1.2.md') }
          else { $releaseArgs += '--generate-notes' }
          gh @releaseArgs
